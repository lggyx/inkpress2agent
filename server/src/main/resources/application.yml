server:
  port: 8080

spring:
  application:
    name: inkpress-server
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:inkpress}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai
    username: ${MYSQL_USER:inkpress}
    password: ${MYSQL_PASSWORD:inkpress123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:inkpress}
    password: ${RABBITMQ_PASSWORD:inkpress123}
    listener:
      simple:
        # 消费失败拒绝不回队：毒消息直接经 DLX 落入 DLQ，避免无限重投循环
        default-requeue-rejected: false
  mail:
    host: ${SMTP_HOST:smtp.local}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

inkpress:
  jwt:
    # 必须通过环境变量注入生产值；本地缺省时启动报错提示
    secret: ${INKPRESS_JWT_SECRET:inkpress-local-dev-secret-change-me}
    access-token-ttl: ${INKPRESS_ACCESS_TTL:PT2H}
    refresh-token-ttl: ${INKPRESS_REFRESH_TTL:P30D}
  es:
    host: ${ES_HOST:localhost}
    port: ${ES_PORT:9200}
    index: ${ES_INDEX:inkpress-articles}
  mail:
    from: ${INKPRESS_MAIL_FROM:inkpress@noreply.local}
    # 邮件正文里的站内链接前缀（退订/文章跳转）
    public-base-url: ${INKPRESS_PUBLIC_BASE_URL:http://127.0.0.1:8912}
    # 每周精选投递时间（默认周一 09:00 北京时间）
    digest-cron: ${INKPRESS_DIGEST_CRON:0 0 9 * * MON}
