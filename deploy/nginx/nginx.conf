server {
    listen 80;
    server_name _;

    # 上游服务（server/web）尚未上线时用变量 + Docker 内嵌 DNS 惰性解析，避免启动即崩溃循环
    resolver 127.0.0.11 valid=10s;
    set $api_upstream "server:8080";
    set $web_upstream "web:3000";

    # 请求体上限（文章与图片/视频上传，视频支持到 200MB）
    client_max_body_size 256m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Trace-Id $request_id;

    # SSE 长连接（AI 流式 / 通知推送）：关缓冲、保活
    location ~ ^/api/(ai|notifications/stream) {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
    }

    # 出站跳转追踪（M6 引流统计）：精确匹配 /r——前缀 /r 会误截 /robots.txt 等路径
    location = /r {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
    }

    # RSS 订阅源（Spring 端点）：精确匹配，避免落入 Nuxt SPA 404
    location = /rss.xml {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
    }

    # 前端 Nuxt
    location / {
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        # nginx 继承规则：location 内出现任意 proxy_set_header 即不再继承 server 级——必须完整重申，
        # 否则前端请求丢失 Host/X-Real-IP（sitemap/canonical 拿到容器名、访客地域统计退化为网关 IP）
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
