name: inkpress

services:
  mysql:
    image: mysql:8.0
    container_name: inkpress-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_inkpress_local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inkpress}
      MYSQL_USER: ${MYSQL_USER:-inkpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-inkpress123}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data-v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: inkpress-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: inkpress-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-inkpress}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-inkpress123}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    build: ./deploy/elasticsearch
    container_name: inkpress-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    volumes:
      - es-data-v2:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  server:
    build: ./server
    container_name: inkpress-server
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inkpress}
      MYSQL_USER: ${MYSQL_USER:-inkpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-inkpress123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-inkpress}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-inkpress123}
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      INKPRESS_JWT_SECRET: ${INKPRESS_JWT_SECRET:-inkpress-local-dev-secret-change-me}
      LOG_DIR: /app/logs
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./web
    container_name: inkpress-web
    environment:
      NUXT_API_BASE: http://server:8080/api
      NUXT_PUBLIC_API_BASE: /api
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: inkpress-nginx
    ports:
      # 绑定全部网卡（局域网设备可访问）；如需仅本机，改回 "127.0.0.1:${INKPRESS_PORT:-8912}:80"
      - "${INKPRESS_PORT:-8912}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # 旧原型残留的 mysql-data / es-data 卷保持不动（数据仍在盘上），
  # 新工程使用独立数据卷，避免与旧 schema 冲突。
  mysql-data-v2:
  redis-data:
  rabbitmq-data:
  es-data-v2:
