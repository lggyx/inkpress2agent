services:
  mysql:
    image: mysql:8.0
    container_name: inkpress-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
    ports:
      # 宿主机端口统一加前缀 2，容器内仍监听 3306
      - "23306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表脚本
      - ./inkpress-server/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inkpress-redis
    restart: unless-stopped
    ports:
      # 宿主机端口统一加前缀 2，容器内仍监听 6379
      - "26376:6379"
    volumes:
      - redis-data:/data

  server:
    build: ./inkpress-server
    container_name: inkpress-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # AI 配置（替换为自己的 API Key）
      AI_BASE_URL: https://open.bigmodel.cn/api/paas/v4
      AI_API_KEY: ""
      AI_MODEL: glm-4-flash
      JWT_SECRET: change-this-to-a-random-secret-in-production
    ports:
      - "28080:28080"

  web:
    image: nginx:alpine
    container_name: inkpress-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "280:80"
    volumes:
      # 先在 inkpress-web 下执行 npm run build 生成 dist
      - ./inkpress-web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql-data:
  redis-data:
